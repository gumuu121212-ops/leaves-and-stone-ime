# Leaves & Stone host settings
# encoding: utf-8

config_version: "1.0"

show_notifications:
  - schema
show_notifications_time: 800
global_ascii: false

style:
  horizontal: true
  inline_preedit: true
  preedit_type: composition
  display_tray_icon: false
  color_scheme: leaves_stone
  font_face: "Microsoft YaHei UI"
  label_font_face: "Microsoft YaHei UI"
  comment_font_face: "Microsoft YaHei UI"
  font_point: 14
  label_font_point: 10
  comment_font_point: 10
  label_format: "%s"
  mark_text: ""
  hover_type: hilite
  paging_on_scroll: true
  layout:
    type: horizontal
    border_width: 0
    margin_x: 0
    margin_y: 0
    spacing: 12
    candidate_spacing: 12
    hilite_spacing: 0
    hilite_padding: 0
    corner_radius: 0
    shadow_radius: 0

preset_color_schemes:
  leaves_stone:
    name: "Leaves & Stone"
    author: "Leaves & Stone contributors"
    color_format: abgr
    text_color: 0x5A4034
    candidate_text_color: 0x4A372D
    label_color: 0x806756
    comment_text_color: 0x806756
    back_color: 0x00FFFFFF
    border_color: 0x00FFFFFF
    shadow_color: 0x00000000
    hilited_text_color: 0x3C2B24
    hilited_back_color: 0x00FFFFFF
    hilited_candidate_text_color: 0x3C2B24
    hilited_candidate_back_color: 0x00FFFFFF
